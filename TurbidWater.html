<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">

    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
</head>

<body>

    <p id="status">Loading CSV...</p>

    <label for="musSelect">mus:</label>
    <select id="musSelect"></select>

    <p>mua values:</p>
    <div id="muaOptions"></div>

    <br>

    <label for="xAxis">X axis:</label>
    <select id="xAxis"></select>

    <label for="yAxis">Y axis:</label>
    <select id="yAxis"></select>

    <br><br>

    <div id="graph" style="width:100%; height:600px;"></div>


    <script>

        let simulationData = [];
        let columnNames = [];

        fetch('data/summary.csv')
            .then(response => response.text())
            .then(text => {

                const lines = text.trim().split(/\r?\n/);

                columnNames = lines[0]
                    .split(',')
                    .map(column => column.trim());

                simulationData = lines.slice(1).map(line => {

                    const values = line.split(',');
                    const row = {};

                    columnNames.forEach((column, i) => {

                        if (column === 'RunID') {
                            row[column] = values[i];
                        } else {
                            row[column] = Number(values[i]);
                        }

                    });

                    return row;
                });


                document.getElementById('status').textContent =
                    `Loaded ${simulationData.length} simulations.`;


                const xAxis = document.getElementById('xAxis');
                const yAxis = document.getElementById('yAxis');


                columnNames.forEach(column => {

                    if (column !== 'RunID') {

                        const xOption = document.createElement('option');
                        xOption.value = column;
                        xOption.textContent = column;
                        xAxis.appendChild(xOption);

                        const yOption = document.createElement('option');
                        yOption.value = column;
                        yOption.textContent = column;
                        yAxis.appendChild(yOption);

                    }

                });


                // Default axes
                xAxis.value = 'DomainZ';
                yAxis.value = 'WeightedMedianPosition';


                // mus dropdown
                const musSelect = document.getElementById('musSelect');

                const musValues = [
                    ...new Set(simulationData.map(row => row.mus))
                ].sort((a, b) => a - b);

                musValues.forEach(value => {

                    const option = document.createElement('option');

                    option.value = value;
                    option.textContent = value;

                    musSelect.appendChild(option);

                });


                // mua checkboxes
                const muaOptions = document.getElementById('muaOptions');

                const muaValues = [
                    ...new Set(simulationData.map(row => row.mua))
                ].sort((a, b) => a - b);

                muaValues.forEach(value => {

                    const checkbox = document.createElement('input');

                    checkbox.type = 'checkbox';
                    checkbox.value = value;
                    checkbox.id = `mua_${value}`;
                    checkbox.checked = true;

                    const label = document.createElement('label');

                    label.htmlFor = checkbox.id;
                    label.textContent = value;

                    muaOptions.appendChild(checkbox);
                    muaOptions.appendChild(label);
                    muaOptions.appendChild(document.createElement('br'));

                    checkbox.addEventListener('change', updateGraph);

                });


                musSelect.addEventListener('change', updateGraph);
                xAxis.addEventListener('change', updateGraph);
                yAxis.addEventListener('change', updateGraph);


                updateGraph();

            });



        function updateGraph() {

            const selectedMus =
                Number(document.getElementById('musSelect').value);

            const selectedX =
                document.getElementById('xAxis').value;

            const selectedY =
                document.getElementById('yAxis').value;


            const selectedMua = Array.from(
                document.querySelectorAll('#muaOptions input:checked')
            ).map(box => Number(box.value));


            const traces = [];


            selectedMua.forEach(muaValue => {

                let filtered = simulationData.filter(row =>
                    row.mus === selectedMus &&
                    row.mua === muaValue
                );


                filtered.sort((a, b) =>
                    a[selectedX] - b[selectedX]
                );


                traces.push({

                    x: filtered.map(row => row[selectedX]),

                    y: filtered.map(row => row[selectedY]),

                    mode: 'lines+markers',

                    type: 'scatter',

                    name: `mua = ${muaValue}`

                });

            });


            const layout = {

                xaxis: {
                    title: selectedX
                },

                yaxis: {
                    title: selectedY
                },

                legend: {
                    title: {
                        text: 'mua'
                    }
                },

                margin: {
                    t: 30
                }

            };


            Plotly.react(
                'graph',
                traces,
                layout,
                {responsive: true}
            );

        }

    </script>

</body>
</html>
