<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
</head>

<body>

    <p id="status">Loading CSV...</p>

    <label for="musSelect">mus:</label>
    <select id="musSelect"></select>

    <br><br>

    <label for="xAxis">X axis:</label>
    <select id="xAxis"></select>

    <label for="yAxis">Y axis:</label>
    <select id="yAxis"></select>


    <script>
        let simulationData = [];
        let columnNames = [];

        fetch('data/summary.csv')
            .then(response => response.text())
            .then(text => {

                const lines = text.trim().split(/\r?\n/);

                columnNames = lines[0]
                    .split(',')
                    .map(column => column.trim());

                simulationData = lines.slice(1).map(line => {

                    const values = line.split(',');
                    const row = {};

                    columnNames.forEach((column, i) => {

                        if (column === 'RunID') {
                            row[column] = values[i];
                        } else {
                            row[column] = Number(values[i]);
                        }

                    });

                    return row;
                });


                document.getElementById('status').textContent =
                    `Loaded ${simulationData.length} simulations.`;


                // X and Y axis dropdowns
                const xAxis = document.getElementById('xAxis');
                const yAxis = document.getElementById('yAxis');

                columnNames.forEach(column => {

                    if (column !== 'RunID') {

                        const xOption = document.createElement('option');
                        xOption.value = column;
                        xOption.textContent = column;
                        xAxis.appendChild(xOption);

                        const yOption = document.createElement('option');
                        yOption.value = column;
                        yOption.textContent = column;
                        yAxis.appendChild(yOption);
                    }

                });


                // mus dropdown
                const musSelect = document.getElementById('musSelect');

                const musValues = [
                    ...new Set(simulationData.map(row => row.mus))
                ].sort((a, b) => a - b);

                musValues.forEach(value => {

                    const option = document.createElement('option');

                    option.value = value;
                    option.textContent = value;

                    musSelect.appendChild(option);

                });

            });

    </script>

</body>
</html>
